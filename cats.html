<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошечки</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo"><i class="fa-solid fa-music"></i></div>
            <nav>
                <a href="index.html" title="Главная"><i class="fa-solid fa-torii-gate"></i></a>
                <a href="feedback.html" title="Отзывы"><i class="fa-solid fa-comment-dots"></i></a>
                <a href="cats.html" class="active" title="Кошечки"><i class="fa-solid fa-paw"></i></a>
                <a href="works.html" title="Галерея"><i class="fa-solid fa-feather"></i></a>
                <a href="music.html" title="Музыка"><i class="fa-solid fa-music"></i></a>
            </nav>
            <div class="bottom-icon"></div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search...">
                </div>
                <div class="user-profile">
                    <a href="https://t.me/yaskim" target="_blank" style="display: flex; align-items: center; gap: 15px; text-decoration: none; color: inherit;">
                        <img src="https://i.pravatar.cc/150?img=5" alt="User">
                        <span>Yask</span>
                        <i class="fa-brands fa-telegram" style="color: #6c5ce7; font-size: 20px;"></i>
                    </a>
                </div>
            </header>

            <h1 style="margin-bottom: 30px; font-size: 28px;">Кошечки <span class="jp-small"></span></h1>

            <!-- ГАЛЕРЕЯ КОТИКОВ -->
            <div class="cat-gallery">
                <div class="cat-card">
                     <img src="catttt.jpg" alt="Тишка :3">
                    <p>Мой любимый котик ^w^</p>
                </div>
                <div class="cat-card">
                    <img src="https://cataas.com/cat?width=400&height=300&tag=cute" alt="Котик 2">
                    <p>Сладкий пушистик</p>
                </div>
                <div class="cat-card">
                    <img src="https://cataas.com/cat?width=400&height=300&tag=sleepy" alt="Котик 3">
                    <p>Сонный кот</p>
                </div>
                <div class="cat-card">
                    <img src="https://cataas.com/cat?width=400&height=300&tag=funny" alt="Котик 4">
                    <p>Смешной котик</p>
                </div>
                <div class="cat-card">
                    <img src="https://cataas.com/cat?width=400&height=300&tag=orange" alt="Котик 5">
                    <p>Рыжий хулиган</p>
                </div>
                <div class="cat-card">
                    <img src="https://cataas.com/cat?width=400&height=300&tag=kitten" alt="Котик 6">
                    <p>Маленький котенок</p>
                </div>
            </div>

        </main>
    </div>

    <div id="themeToggle" title="Сменить тему">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
    </div>

    <script src="script.js"></script>
</body>
</html>
